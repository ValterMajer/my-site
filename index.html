<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 40px 20px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
        }

        .content {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <header>
        <h1>Мой сайт</h1>
        <p>Добро пожаловать!</p>
    </header>

    <div class="content">
        <h2>О сайте</h2>

        <p>
            Здесь я буду размещать информацию,
            фотографии и свои проекты.
        </p>

        <button onclick="alert('Спасибо за посещение!')">
            Нажми меня
        </button>
    </div>

</body>
</html>
